<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conquest of Inazuma</title>
<link rel="icon" type="image/png" href="assets/title/logo.png">
<link rel="stylesheet" href="scripts/style.css">
</head>
<body>

<div class="game-root" id="root">
  <div class="bg-layer" id="bgLayerA"></div>
  <div class="bg-layer" id="bgLayerB"></div>
  <div class="bg-scrim"></div>
  <div class="storm-veil"></div>
  <div class="flash" id="flash"></div>
  <div class="vignette"></div>

  <div class="gameframe" id="gameframe">

    <!-- LEFT: Party panel (swap target: becomes Enemies during combat) -->
    <div class="side-panel side-panel--left" id="left-panel">
      <div class="panel-header">
        <span class="panel-title" id="left-panel-title">Party</span>
        <span class="panel-header-glyphs">☯ ⚔ ☯</span>
      </div>

      <div class="panel-body" id="left-panel-body">
        <!-- Blocked-out example unit card. Real cards will be generated by JS later. -->
        <div class="unit-card">
          <div class="unit-card-header">
            <span class="unit-name">Mutton</span>
            <span class="unit-vision-icon"></span>
          </div>
          <div class="unit-card-body">
            <div class="unit-portrait"></div>
            <div class="unit-item-slots">
              <div class="item-slot"></div><div class="item-slot"></div><div class="item-slot"></div>
              <div class="item-slot"></div><div class="item-slot"></div><div class="item-slot"></div>
            </div>
          </div>
          <div class="unit-card-footer">
            <span class="unit-hp">155</span>
            <span class="unit-more">•••</span>
          </div>
        </div>

        <div class="unit-card">
          <div class="unit-card-header">
            <span class="unit-name">Kuki</span>
            <span class="unit-vision-icon"></span>
          </div>
          <div class="unit-card-body">
            <div class="unit-portrait"></div>
            <div class="unit-item-slots">
              <div class="item-slot"></div><div class="item-slot"></div><div class="item-slot"></div>
              <div class="item-slot"></div><div class="item-slot"></div><div class="item-slot"></div>
            </div>
          </div>
          <div class="unit-card-footer">
            <span class="unit-hp">147</span>
            <span class="unit-more">•••</span>
          </div>
        </div>

        <!-- Up to 4 total unit-card slots supported; 2 more can follow this same shape -->
      </div>

      <div class="panel-footer-stats" id="party-resources">
        <div class="resource-track">
          <span class="resource-label">Abyssal Influence</span>
          <span class="resource-value">0</span>
        </div>
		<div class="resource-track">
          <span class="resource-icon">⛁</span>
          <span class="resource-value">409</span>
        </div>
        <div class="resource-label-sub">Mora</div>
      </div>
    </div>

    <!-- CENTER: stage (parchment content + button deck), unchanged mechanically -->
    <div class="stage">

      <div id="screen-content" class="screen-content">

        <!-- MAIN MENU LAYOUT -->
        <div class="layout" id="layout-mainmenu">
          <div class="crest">
            <img src="assets/title/logo.png" alt="Conquest of Inazuma crest">
          </div>
          <div class="content-block">
            <div class="kanji-mark">雷 影 抗 争</div>
            <div class="title-en">
              <div class="line1">CONQUEST</div>
              <div class="line2">OF</div>
              <div class="line3">INAZUMA</div>
            </div>
            <div class="divider"></div>
            <div class="subtitle">· chronicles of the vision hunt decree ·</div>
          </div>
        </div>

        <!-- CONTENT LAYOUT (renamed from layout-generic) — holds dialogue,
             scene text, combat, shops, everything that isn't the main menu -->
        <div class="layout" id="layout-content" style="display:none;">
          <div class="parchment-panel">
            <div class="parchment-text" id="parchment-text"></div>
          </div>
        </div>

      </div>

      <!-- PERSISTENT BUTTON DECK: exists once, relabeled per screen -->
      <div class="button-deck" id="button-deck">
        <div class="button-row">
          <div class="action-btn empty" data-slot="1"><span class="label"></span><span class="keycap">1</span></div>
          <div class="action-btn empty" data-slot="2"><span class="label"></span><span class="keycap">2</span></div>
          <div class="action-btn empty" data-slot="3"><span class="label"></span><span class="keycap">3</span></div>
          <div class="action-btn empty" data-slot="4"><span class="label"></span><span class="keycap">4</span></div>
          <div class="action-btn empty" data-slot="5"><span class="label"></span><span class="keycap">5</span></div>
        </div>
        <div class="button-row">
          <div class="action-btn empty" data-slot="6"><span class="label"></span><span class="keycap">6</span></div>
          <div class="action-btn empty" data-slot="7"><span class="label"></span><span class="keycap">7</span></div>
          <div class="action-btn empty" data-slot="8"><span class="label"></span><span class="keycap">8</span></div>
          <div class="action-btn empty" data-slot="9"><span class="label"></span><span class="keycap">9</span></div>
          <div class="action-btn empty" data-slot="10"><span class="label"></span><span class="keycap">0</span></div>
        </div>
      </div>

      <!-- Mobile-only arrow: swaps visible button-row between A (1-5) and B (6-10) -->
      <div class="row-arrow" id="row-arrow"></div>

    </div>

    <!-- RIGHT: Location panel (minimap / day-hour / compass / footer icons) -->
    <div class="side-panel side-panel--right" id="right-panel">
      <div class="panel-header">
        <span class="panel-title" id="right-panel-title">Watatsumi</span>
        <span class="panel-header-glyphs">☯ ⚔ ☯</span>
      </div>

      <div class="minimap-box" id="minimap-box">
		  <div class="minimap-zoom-controls">
			<div class="zoom-btn" id="zoom-in-btn">+</div>
			<div class="zoom-btn" id="zoom-out-btn">−</div>
		  </div>
		  <div class="minimap-render" id="minimap-render"></div>
		  <div class="minimap-corner-controls">
			<div class="minimap-icon-btn"></div>
			<div class="minimap-icon-btn"></div>
		  </div>
		</div>

      <div class="daytime-bar" id="daytime-bar">
        <div class="day-counter">
          <span class="day-badge" id="day-number">1</span>
        </div>
        <div class="hour-indicator" id="hour-indicator">hour indicator (time of day)</div>
      </div>

	<div class="compass-box" id="compass-box">
	  <div class="compass-dial">
		<div class="compass-arrow compass-arrow--n" data-dir="north" title="North"><span>▲</span></div>
		<div class="compass-arrow compass-arrow--w" data-dir="west" title="West"><span>◀</span></div>
		<div class="compass-rose">☯</div>
		<div class="compass-arrow compass-arrow--e" data-dir="east" title="East"><span>▶</span></div>
		<div class="compass-arrow compass-arrow--s" data-dir="south" title="South"><span>▼</span></div>
	  </div>
	</div>
	
      <div class="row-arrow-echo" id="right-row-arrow">
        <span class="arrow-left">←</span>
        <span class="arrow-divider"></span>
        <span class="arrow-right">→</span>
      </div>

      <div class="hud-footer-icons">
        <div class="footer-icon-btn" id="btn-journal">
          <span class="footer-icon-badge" id="journal-badge">4</span>
          <div class="footer-icon-glyph">📖</div>
          <div class="footer-icon-label">Journal</div>
        </div>
        <div class="footer-icon-btn" id="btn-data">
          <div class="footer-icon-glyph">🔖</div>
          <div class="footer-icon-label">Data</div>
        </div>
        <div class="footer-icon-btn" id="btn-menu">
          <div class="footer-icon-glyph">⚙</div>
          <div class="footer-icon-label">Menu</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Core engine, loaded first -->
<script src="scripts/engine.js"></script>
<script src="scripts/registry.js"></script>
<script src="scripts/gamestate.js"></script>
<script src="scripts/compass.js"></script>
<script src="scripts/minimap.js"></script>

<script src="maps/watatsumi.js"></script>
<script src="rooms/watatsumiRooms.js"></script>

<!-- Screen content modules. Each registers itself with the engine. -->
<script src="screens/mainmenu/mainmenu.js"></script>
<script src="screens/intro/intro.js"></script>
<script src="screens/explore/explore.js"></script>

<script>
  Engine.init();
</script>

</body>
</html>
